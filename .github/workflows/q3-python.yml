name: Python

on:
  pull_request:
    branches: ["develop"]
    types: [closed]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Check
        run: python -m py_compile src/main.py


      - name: Create tag
        env: 
          TAG: "build-${{ github.run_id }}"
        run: |
          git tag $TAG
          git push --tag
