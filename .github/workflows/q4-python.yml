name: Python

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Check
        run: python -m py_compile src/main.py

      - name: Test
        run: pytest -v

      - name: Build image
        run: |
          docker build -t app .

      - name: Run container
        run: |
          docker run --name servidor -d -p 8080:8080 app
